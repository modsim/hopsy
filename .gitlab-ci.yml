.python_versions: &python_versions
  PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

image: quay.io/pypa/manylinux_2_28_x86_64

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0  # CRITICAL: Needed so setuptools_scm can see tags/history
  GIT_SUBMODULE_STRATEGY: recursive # Fetch hops
  UV_CACHE_DIR: ".uv-cache"

stages:
  - build
  - test
  - upload-artifacts

.pre-commit:  # TEMP hidden for probe-jetson run
  image: python:3.14
  stage: build
  cache:
    paths:
      - .uv-cache
      - "${CI_PROJECT_DIR}/.pre-commit-cache"
  script:
    - python -m pip install uv
    - uv tool run pre-commit run --all-files

.build-debug:  # TEMP hidden for probe-jetson run
  stage: build
  script:
    - /opt/python/cp314-cp314/bin/pip install uv
    - uv venv
    - source .venv/bin/activate
    # Build a debug wheel. We pass 'Debug' to CMake via scikit-build-core configuration
    - uv build --wheel --python 3.14 -Ccmake.build-type=Debug
    - auditwheel repair dist/hopsy-*.whl -w dist/
  artifacts:
    paths:
      - dist/*manylinux*
    expire_in: 7 days

.build-release:  # TEMP hidden for probe-jetson run
  stage: build
  parallel:
    matrix:
      - *python_versions
  script:
    - PY_VER_CLEAN=$(echo $PYTHON_VERSION | tr -d '.')
    - PY_PATH="/opt/python/cp${PY_VER_CLEAN}-cp${PY_VER_CLEAN}/bin"
    - $PY_PATH/pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv build --wheel --python $PYTHON_VERSION
    - auditwheel repair dist/hopsy-*.whl -w dist/
  artifacts:
    paths:
      - dist/*manylinux*
    expire_in: 7 days

# Compile-only check of the experimental CUDA backend (hopsy.gpu)
.build-gpu:  # TEMP hidden for probe-jetson run
  stage: build
  variables:
    CUDA_VERSION: "12-9"
    CUDA_HOME: "/usr/local/cuda-12.9"
    CUDACXX: "/usr/local/cuda-12.9/bin/nvcc"
  before_script:
    - dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
    - dnf install -y
        cuda-nvcc-${CUDA_VERSION} cuda-cudart-devel-${CUDA_VERSION}
        libcublas-devel-${CUDA_VERSION} libcusparse-devel-${CUDA_VERSION}
        libcurand-devel-${CUDA_VERSION} libnvjitlink-devel-${CUDA_VERSION}
    - export PATH="${CUDA_HOME}/bin:${PATH}"
  script:
    - /opt/python/cp312-cp312/bin/pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv build --wheel --python 3.12 -Ccmake.define.HOPSY_BUILD_GPU=ON
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 7 days

# TEMPORARY: probe the Jetson runner's executor and
# JetPack/CUDA setup. Remove before the MR is merged.
probe-jetson:
  stage: build
  image: quay.io/pypa/manylinux_2_28_aarch64
  tags: [jetson]
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  script:
    - uname -r
    - echo "== L4T / JetPack version (from host files mounted into the container) =="
    - cat /sys/firmware/devicetree/base/model 2>/dev/null || true
    - cat /sys/devices/soc0/soc_id /sys/devices/soc0/revision 2>/dev/null || true
    - ls -la /usr/lib/aarch64-linux-gnu/tegra/libcuda.so* /usr/lib/aarch64-linux-gnu/libcuda.so* || true
    - grep -a -o -E '(R3[0-9]|r3[0-9])[._][0-9]+(\.[0-9]+)?' /usr/lib/aarch64-linux-gnu/tegra/libcuda.so.1.1 | sort -u | head || true
    - grep -a -o -E 'CUDA [0-9]+\.[0-9]+' /usr/lib/aarch64-linux-gnu/tegra/libcuda.so.1.1 | sort -u | head || true
    - echo "== CUDA driver API via ctypes (needs no toolkit) =="
    - |
      /opt/python/cp312-cp312/bin/python - <<'EOF'
      import ctypes
      cu = ctypes.CDLL("libcuda.so.1")
      def check(name, *args):
          rc = getattr(cu, name)(*args)
          if rc != 0:
              msg = ctypes.c_char_p()
              cu.cuGetErrorString(rc, ctypes.byref(msg))
              raise SystemExit(f"{name} failed: {rc} {msg.value}")
      check("cuInit", 0)
      v = ctypes.c_int(); check("cuDriverGetVersion", ctypes.byref(v))
      print(f"driver supports CUDA {v.value // 1000}.{v.value % 1000 // 10}")
      n = ctypes.c_int(); check("cuDeviceGetCount", ctypes.byref(n))
      print("device count:", n.value)
      for i in range(n.value):
          d = ctypes.c_int(); check("cuDeviceGet", ctypes.byref(d), i)
          name = ctypes.create_string_buffer(256); check("cuDeviceGetName", name, 256, d)
          major, minor = ctypes.c_int(), ctypes.c_int()
          check("cuDeviceGetAttribute", ctypes.byref(major), 75, d)  # COMPUTE_CAPABILITY_MAJOR
          check("cuDeviceGetAttribute", ctypes.byref(minor), 76, d)  # COMPUTE_CAPABILITY_MINOR
          mem = ctypes.c_size_t(); check("cuDeviceTotalMem_v2", ctypes.byref(mem), d)
          print(f"device {i}: {name.value.decode()} sm_{major.value}{minor.value} {mem.value / 2**30:.1f} GiB")
      ctx = ctypes.c_void_p(); check("cuCtxCreate_v2", ctypes.byref(ctx), 0, d)
      ptr = ctypes.c_uint64(); check("cuMemAlloc_v2", ctypes.byref(ptr), 1 << 20)
      check("cuMemFree_v2", ptr); check("cuCtxDestroy_v2", ctx)
      print("context create + 1 MiB alloc/free: OK")
      EOF

.build-release-macos:  # TEMP hidden for probe-jetson run
  stage: build
  tags:
    - macos
  parallel:
    matrix:
      - *python_versions
  before_script:
    - brew install uv || true
  script:
    - uv venv
    - source .venv/bin/activate
    - uv build --wheel --python $PYTHON_VERSION
    - pip install delocate
    - delocate-wheel -v dist/hopsy-*.whl
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 7 days

.test-debug:  # TEMP hidden for probe-jetson run
  stage: test
  dependencies:
    - build-debug
  script:
    - PYTHON_VERSION=3.14
    - PY_VER_CLEAN=$(echo $PYTHON_VERSION | tr -d '.')
    - PY_PATH="/opt/python/cp${PY_VER_CLEAN}-cp${PY_VER_CLEAN}/bin"
    - $PY_PATH/pip install uv
    - uv venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --dev --all-extras
    - uv pip install hopsy --find-links dist/
    - python -m unittest -v tests

.test-release:  # TEMP hidden for probe-jetson run
  stage: test
  dependencies:
    - build-release
  parallel:
    matrix:
      - *python_versions
  script:
    - PY_VER_CLEAN=$(echo $PYTHON_VERSION | tr -d '.')
    - PY_PATH="/opt/python/cp${PY_VER_CLEAN}-cp${PY_VER_CLEAN}/bin"
    - $PY_PATH/pip install uv
    - uv venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --dev --all-extras
    - uv pip install hopsy --find-links dist/
    - python -m unittest -v tests

.test-release-macos:  # TEMP hidden for probe-jetson run
  stage: test
  tags:
    - macos
  dependencies:
    - build-release-macos
  parallel:
    matrix:
      - *python_versions
  before_script:
    - brew install uv || true
  script:
    - uv venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --dev --all-extras
    - uv pip install hopsy --find-links dist/
    - python -m unittest -v tests

.test-integration-release:  # TEMP hidden for probe-jetson run
  stage: test
  dependencies:
    - build-release
  script:
    - PYTHON_VERSION=3.14
    - PY_VER_CLEAN=$(echo $PYTHON_VERSION | tr -d '.')
    - PY_PATH="/opt/python/cp${PY_VER_CLEAN}-cp${PY_VER_CLEAN}/bin"
    - $PY_PATH/pip install uv
    - uv venv --python $PYTHON_VERSION
    - source .venv/bin/activate
    - uv sync --locked --dev --all-extras --group integration-tests
    - uv pip install --prerelease=allow mcbackend
    - uv pip install hopsy --find-links dist/
    - curl https://clickhouse.com/ | sh
    - ./clickhouse server &> clickhouse.log &
    - sleep 5
    - for f in examples/*.py; do python $f || exit 1; done
    - for f in examples/*.ipynb; do python -m jupyter nbconvert --to notebook --execute $f || exit 1; done
  after_script:
    - pkill clickhouse || true

.build-docs:  # TEMP hidden for probe-jetson run
  stage: test
  image: ubuntu:24.04
  dependencies:
    - build-release
  script:
    - apt update && apt install -y python3-dev pandoc python3-pip curl git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env
    - uv venv
    - source .venv/bin/activate
    - uv sync --locked --dev --all-extras
    - uv pip install hopsy --find-links dist/
    - mkdir new-docs
    - sphinx-build -b html docs-sources new-docs
    - docov hopsy --output new-docs/
  artifacts:
    paths:
      - new-docs
